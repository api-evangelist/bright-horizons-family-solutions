description: >-
  Bright Horizons Family Solutions Inc. (NYSE: BFAM) is the largest provider of
  employer-sponsored child care in the United States, headquartered in Newton,
  Massachusetts and founded in 1986 by Linda Mason and Roger Brown. The company
  operates more than 1,000 early-education and child-care centers across the US,
  UK, Netherlands, and India, serving roughly 1,450 employer clients through three
  core lines: Full Service Center-Based Child Care (on-site and near-site centers
  for employer-sponsored families), Back-Up Care (last-minute child, adult/elder,
  and pet care via in-home and in-center networks), and Educational Advisory
  Services. The Educational Advisory segment is anchored by EdAssist by Bright
  Horizons (tuition assistance, student loan repayment, and workforce education
  administration covering 257 employer clients, 4.7 million eligible learners,
  and more than $1 billion in education and loan payments administered annually),
  College Coach (college admissions coaching delivered as an employee benefit),
  and Sittercity (consumer caregiver marketplace acquired in 2020 and offered
  through corporate benefits). Bright Horizons sells exclusively to enterprise
  HR and benefits buyers — 72 of the Fortune 1000's top 100 companies use
  EdAssist — and does not publish public APIs, SDKs, a developer portal, status
  page, or a public GitHub organization. The brighthorizons GitHub org exists
  but contains zero public repositories. This profile documents the corporate
  structure, segment portfolio, and employer-benefit positioning of a child-care
  and family-benefits operator that runs a closed B2B technology stack with no
  third-party developer surface.
