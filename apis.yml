  - name: Full Service Center-Based Child Care
    description: >-
      Employer-sponsored on-site, near-site, and consortium child-care centers
      delivering infant, toddler, preschool, and kindergarten-prep programs.
      Operates more than 1,000 centers across the United States, United Kingdom,
      the Netherlands, and India.
    url: https://www.brighthorizons.com/our-solutions
  - name: Back-Up Care
    description: >-
      On-demand backup care for children, adults/elders, and pets delivered
      through a network of Bright Horizons centers, partner centers, and
      in-home caregivers when an employee's regular care arrangement breaks
      down. Sold as an employer-paid benefit with capped employee co-pays.
    url: https://www.brighthorizons.com/back-up-care
  - name: Educational Advisory Services
    description: >-
      Workforce education and family-support advisory services sold to
      employers. Includes EdAssist (tuition assistance, student loan repayment,
      Level Up Studio skills coaching), College Coach (college admissions
      coaching), Workforce Consulting, and Care Advising for complex family
      caregiving needs.
    url: https://www.brighthorizons.com/edassist-solutions
  - name: Sittercity
    description: >-
      Consumer caregiver marketplace (acquired 2020) connecting families with
      babysitters, nannies, pet sitters, senior companions, and tutors.
      Available in 96% of US neighborhoods with 140,000+ five-star reviews.
      Offered to enterprise users as a Bright Horizons employee benefit.
    url: https://www.sittercity.com
